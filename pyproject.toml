[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-deduplicator"
version = "0.1.0"
description = "AI-driven file organization and deduplication tools."
readme = "README.md"
requires-python = ">=3.7" # Increased slightly for safety with newer features
license = {text = "MIT License"} # Assuming MIT, can be changed
authors = [
  {name = "Your Name", email = "you@example.com"}, # Placeholder
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

dependencies = [
    "requests>=2.0",
]

[project.optional-dependencies]
full = [
    "openai>=1.0",      # Added version constraint example
    "pandas>=1.0",
    "matplotlib>=3.0",
]
ai = ["openai>=1.0"]
viz = ["pandas>=1.0", "matplotlib>=3.0"]

[project.scripts]
ai-deduplicate = "ai_deduplicator.ai_dynamic_deduplicate:main"
deduplicate = "ai_deduplicator.deduplicate_files:main"

[project.urls]
"Homepage" = "https://github.com/yourusername/ai-deduplicator" # Placeholder
"Bug Tracker" = "https://github.com/yourusername/ai-deduplicator/issues" # Placeholder 